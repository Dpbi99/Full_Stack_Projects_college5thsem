<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 20px;
            height: 100vh;
            background: linear-gradient(30deg,aquamarine,rgb(84, 185, 218));
        }
        #taskInput{
            padding: 5px;
            margin-right: 15px;
            border: 2px solid #201dc1;
            border-radius: 25px;
            
        }
        #addTaskButton {
            padding: 5px 10px;
            border: 2px solid #c11d1d;
            border-radius: 25px;
            
            cursor: pointer;
        }
        button {
            transition: all 1s ease;
            border-radius: 25px;
            padding: 5px 10px;
            margin:5px;
        }
        button:hover {
            background: linear-gradient(45deg,rgb(14, 168, 168),cyan);
            box-shadow: black 5px 5px 5px;
        }
        #taskList {
            list-style-type: decimal;
            padding: 10px;
            margin-left: 10px;
        }
        input:hover {
            box-shadow: black 5px 5px 5px;
            transition: all 1s ease;
            
        }


    </style>
</head>
<body>
    <h1><u>Task Manager</u></h1>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button id="addTaskButton">Add Task</button>
    <ol id="taskList" >
    </ol>

    <script src="task.js"></script>
</body>
</html>
