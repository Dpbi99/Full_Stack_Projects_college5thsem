<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: aquamarine;
            
        }
        #taskInput{
            padding: 5px;
            margin-right: 15px;
            border: 2px solid #201dc1;
            border-radius: 25px;
        }
        #addTaskButton {
            padding: 5px 10px;
            border: 2px solid #c11d1d;
            border-radius: 25px;
            transition-duration: 2s;
        }
        button:hover {
            background: linear-gradient(45deg,rgb(62, 149, 225),rgb(14, 168, 168));
            transition-duration: 2s;
        }

    </style>
</head>
<body>
    <h1>Task Manager</h1>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button id="addTaskButton">Add Task</button>
    <ul id="taskList">
    </ul>

    <script src="task.js"></script>
</body>
</html>
